name: Scrape & Deploy

on:
  schedule:
    # Cada hora, al minuto :23 (evito el minuto :00, que es cuando GitHub está
    # más congestionado y descarta más corridas programadas). Ajusta aquí si lo necesitas.
    - cron: '23 * * * *'
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**' # las capturas de datos no re-disparan el deploy

permissions:
  contents: write # para guardar las capturas en el repo
  pages: write
  id-token: write

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Solo baja datos en las corridas programadas/manuales (no en push de código).
      - name: Scrape inventario
        if: github.event_name != 'push'
        env:
          SCRAPE_CONCURRENCY: '8'
          SCRAPE_DELAY_MS: '60'
        run: npm run scrape

      - name: Guardar capturas en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add public/data
          if git diff --cached --quiet; then
            echo "sin cambios en datos"
            exit 0
          fi
          git commit -m "data: captura $(date -u +%FT%TZ)"
          # Push robusto: si el remoto avanzó (otra corrida o edición manual),
          # traemos con rebase y reintentamos hasta 5 veces.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "push OK (intento $i)"
              exit 0
            fi
            echo "push falló, reintentando ($i)..."
            sleep 5
          done
          echo "no se pudo hacer push tras 5 intentos" >&2
          exit 1

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
