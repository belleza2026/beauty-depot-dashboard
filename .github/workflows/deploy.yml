name: Scrape & Deploy

on:
  schedule:
    # Cada 1 horas (UTC). Ajusta el intervalo aquí si lo necesitas.
    - cron: '5 */3 * * *'
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**' # las capturas de datos no re-disparan el deploy

permissions:
  contents: write # para guardar las capturas en el repo
  pages: write
  id-token: write

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Solo baja datos en las corridas programadas/manuales (no en push de código).
      - name: Scrape inventario
        if: github.event_name != 'push'
        env:
          SCRAPE_CONCURRENCY: '8'
          SCRAPE_DELAY_MS: '60'
        run: npm run scrape

      - name: Guardar capturas en el repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: captura $(date -u +%FT%TZ)" || echo "sin cambios"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
